<!DOCTYPE html>

<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>CarCash</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;

        background:
            radial-gradient(circle at 20% 20%, rgba(0, 140, 255, .25), transparent 30%),
            radial-gradient(circle at 80% 80%, rgba(130, 0, 255, .25), transparent 30%),
            #070b14;

        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
    }

    /* LANGUAGE MENU */
    .language-box {
        position: fixed;
        top: 25px;
        right: 25px;
        z-index: 1000;
    }

    .language-button {
        display: flex;
        align-items: center;
        gap: 8px;

        background: rgba(15, 22, 38, .9);
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 12px;

        padding: 10px 14px;

        color: white;
        font-size: 14px;
        font-weight: bold;

        cursor: pointer;

        width: auto;

        transition: .2s;
    }

    .language-button:hover {
        border-color: rgba(0,198,255,.6);
        transform: none;
    }

    .arrow {
        font-size: 11px;
        opacity: .7;
    }

    .language-menu {
        display: none;

        position: absolute;
        right: 0;
        top: 52px;

        min-width: 150px;

        background: rgba(12, 18, 32, .98);
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 14px;

        padding: 7px;

        box-shadow: 0 15px 40px rgba(0,0,0,.5);
    }

    .language-menu.active {
        display: block;
    }

    .language-option {
        display: flex;
        align-items: center;
        gap: 10px;

        width: 100%;

        padding: 11px 12px;

        border-radius: 9px;

        color: white;
        background: transparent;

        border: none;

        cursor: pointer;

        font-size: 14px;
        font-weight: 600;

        text-align: left;

        transition: .2s;
    }

    .language-option:hover {
        background: rgba(0,198,255,.12);
        transform: none;
    }

    .language-option.selected {
        background: rgba(0,198,255,.18);
    }

    .flag {
        font-size: 20px;
    }

    .container {
        width: 90%;
        max-width: 1100px;
        text-align: center;
    }

    .logo {
        font-size: 52px;
        font-weight: 900;
        letter-spacing: 3px;
        margin-bottom: 10px;

        background: linear-gradient(90deg, #00c6ff, #7c3cff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        color: #aab4c8;
        font-size: 18px;
        margin-bottom: 45px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
        max-width: 700px;
        margin: auto;
    }

    .card {
        background: rgba(15, 22, 38, .85);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 20px;
        padding: 35px 25px;

        box-shadow: 0 15px 40px rgba(0,0,0,.35);

        transition: .25s;
    }

    .card:hover {
        transform: translateY(-6px);
        border-color: rgba(0,198,255,.5);
    }

    .icon {
        font-size: 55px;
        margin-bottom: 15px;
    }

    .card h2 {
        margin-bottom: 10px;
    }

    .card p {
        color: #9da8bc;
        margin-bottom: 25px;
    }

    button {
        width: 100%;
        padding: 14px;

        border: none;
        border-radius: 12px;

        color: white;
        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        background: linear-gradient(90deg, #009dff, #6840ff);

        transition: .2s;
    }

    button:hover {
        transform: scale(1.03);
        filter: brightness(1.15);
    }

    .language-button {
        width: auto;
    }

    .footer {
        margin-top: 35px;
        color: #68758c;
        font-size: 13px;
    }

    @media (max-width: 650px) {
        .cards {
            grid-template-columns: 1fr;
        }

        .logo {
            font-size: 40px;
        }

        .language-box {
            top: 15px;
            right: 15px;
        }
    }
</style>
```

</head>

<body>

```
<!-- LANGUAGE SELECTOR -->
<div class="language-box">

    <button class="language-button" onclick="toggleLanguageMenu()">
        <span id="currentFlag">🇦🇿</span>
        <span id="currentLanguage">AZE</span>
        <span class="arrow">▼</span>
    </button>

    <div class="language-menu" id="languageMenu">

        <button class="language-option" onclick="changeLanguage('az')">
            <span class="flag">🇦🇿</span>
            <span>AZE</span>
        </button>

        <button class="language-option" onclick="changeLanguage('en')">
            <span class="flag">🇬🇧</span>
            <span>ENG</span>
        </button>

        <button class="language-option" onclick="changeLanguage('ru')">
            <span class="flag">🇷🇺</span>
            <span>RUS</span>
        </button>

    </div>

</div>


<div class="container">

    <div class="logo">
        CarCash
    </div>

    <div class="subtitle" id="subtitle">
        Virtual Car Investment Platform
    </div>

    <div class="cards">

        <div class="card">

            <div class="icon">
                🚗
            </div>

            <h2 id="loginTitle">
                Login
            </h2>

            <p id="loginDescription">
                Hesabına daxil ol və maşınlarını idarə et.
            </p>

            <button id="loginButton" onclick="location.href='/login.html'">
                Login
            </button>

        </div>


        <div class="card">

            <div class="icon">
                🏎️
            </div>

            <h2 id="registerTitle">
                Register
            </h2>

            <p id="registerDescription">
                Yeni hesab yarat və CarCash-a başla.
            </p>

            <button id="registerButton" onclick="location.href='/register.html'">
                Register
            </button>

        </div>

    </div>


    <div class="footer">
        © 2026 CarCash
    </div>

</div>


<script>

    const translations = {

        az: {
            flag: "🇦🇿",
            name: "AZE",

            subtitle: "Virtual Avtomobil İnvestisiya Platforması",

            loginTitle: "Giriş",
            loginDescription: "Hesabına daxil ol və maşınlarını idarə et.",
            loginButton: "Giriş",

            registerTitle: "Qeydiyyat",
            registerDescription: "Yeni hesab yarat və CarCash-a başla.",
            registerButton: "Qeydiyyat"
        },

        en: {
            flag: "🇬🇧",
            name: "ENG",

            subtitle: "Virtual Car Investment Platform",

            loginTitle: "Login",
            loginDescription: "Log in to your account and manage your cars.",
            loginButton: "Login",

            registerTitle: "Register",
            registerDescription: "Create a new account and start with CarCash.",
            registerButton: "Register"
        },

        ru: {
            flag: "🇷🇺",
            name: "RUS",

            subtitle: "Виртуальная платформа инвестиций в автомобили",

            loginTitle: "Вход",
            loginDescription: "Войдите в аккаунт и управляйте своими автомобилями.",
            loginButton: "Войти",

            registerTitle: "Регистрация",
            registerDescription: "Создайте новый аккаунт и начните с CarCash.",
            registerButton: "Регистрация"
        }

    };


    function toggleLanguageMenu() {

        const menu = document.getElementById("languageMenu");

        menu.classList.toggle("active");

    }


    function changeLanguage(language) {

        const data = translations[language];

        if (!data) return;


        document.documentElement.lang = language;


        document.getElementById("currentFlag").textContent = data.flag;
        document.getElementById("currentLanguage").textContent = data.name;

        document.getElementById("subtitle").textContent = data.subtitle;

        document.getElementById("loginTitle").textContent = data.loginTitle;
        document.getElementById("loginDescription").textContent = data.loginDescription;
        document.getElementById("loginButton").textContent = data.loginButton;

        document.getElementById("registerTitle").textContent = data.registerTitle;
        document.getElementById("registerDescription").textContent = data.registerDescription;
        document.getElementById("registerButton").textContent = data.registerButton;


        localStorage.setItem("carcash_language", language);


        document.querySelectorAll(".language-option").forEach(option => {
            option.classList.remove("selected");
        });


        const selected = document.querySelector(
            `.language-option[onclick="changeLanguage('${language}')"]`
        );

        if (selected) {
            selected.classList.add("selected");
        }


        document.getElementById("languageMenu").classList.remove("active");
    }


    // Close menu when clicking outside
    document.addEventListener("click", function(event) {

        const box = document.querySelector(".language-box");

        if (!box.contains(event.target)) {
            document.getElementById("languageMenu").classList.remove("active");
        }

    });


    // Load saved language
    const savedLanguage =
        localStorage.getItem("carcash_language") || "az";

    changeLanguage(savedLanguage);

</script>


</body>
</html>
