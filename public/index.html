<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CarCash</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at 20% 20%, rgba(0, 140, 255, .25), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(130, 0, 255, .25), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(0, 255, 140, .08), transparent 35%),
                #070b14;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow-x: hidden;
        }

        /* =========================
           LANGUAGE MENU
        ========================= */

        .language-box {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1000;
        }

        .language-button {
            display: flex;
            align-items: center;
            gap: 8px;

            background: rgba(15, 22, 38, .9);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;

            padding: 10px 14px;

            color: white;
            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            width: auto;

            transition: .2s;
        }

        .language-button:hover {
            border-color: rgba(0,198,255,.6);
            transform: none;
        }

        .arrow {
            font-size: 11px;
            opacity: .7;
        }

        .language-menu {
            display: none;

            position: absolute;
            right: 0;
            top: 52px;

            min-width: 150px;

            background: rgba(12, 18, 32, .98);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;

            padding: 7px;

            box-shadow: 0 15px 40px rgba(0,0,0,.5);
        }

        .language-menu.active {
            display: block;
        }

        .language-option {
            display: flex;
            align-items: center;
            gap: 10px;

            width: 100%;

            padding: 11px 12px;

            border-radius: 9px;

            color: white;
            background: transparent;

            border: none;

            cursor: pointer;

            font-size: 14px;
            font-weight: 600;

            text-align: left;

            transition: .2s;
        }

        .language-option:hover {
            background: rgba(0,198,255,.12);
            transform: none;
        }

        .language-option.selected {
            background: rgba(0,198,255,.18);
        }

        .flag {
            font-size: 20px;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 90%;
            max-width: 1100px;
            text-align: center;

            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #00c6ff,
                #7c3cff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            position: relative;

            text-shadow:
                0 0 18px rgba(0,198,255,.25),
                0 0 35px rgba(124,60,255,.15);
        }

        .subtitle {
            color: #aab4c8;
            font-size: 18px;
            margin-bottom: 45px;
        }

        /* =========================
           CARDS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: rgba(15, 22, 38, .88);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 20px;

            padding: 35px 25px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.35);

            transition: .25s;

            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "🎄";

            position: absolute;

            top: 8px;
            right: 10px;

            font-size: 21px;

            opacity: .75;

            pointer-events: none;
        }

        .card::after {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            border-radius: inherit;

            box-shadow:
                inset 0 0 0 1px rgba(66,223,150,.08);
        }

        .card:hover {
            transform: translateY(-6px);

            border-color: rgba(255,59,48,.65);

            box-shadow:
                0 0 20px rgba(255,59,48,.12),
                0 15px 40px rgba(0,0,0,.35);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;

            position: relative;
            z-index: 2;
        }

        .card h2 {
            margin-bottom: 10px;

            position: relative;
            z-index: 2;
        }

        .card p {
            color: #9da8bc;
            margin-bottom: 25px;

            position: relative;
            z-index: 2;
        }

        /* =========================
           BUTTON
        ========================= */

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 12px;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #009dff,
                    #6840ff
                );

            transition: .2s;
        }

        button:hover {
            transform: scale(1.03);
            filter: brightness(1.15);
        }

        .language-button {
            width: auto;
        }

        .card button {
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .card button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.3),
                    transparent
                );

            transform: skewX(-20deg);

            animation: christmasShine 3.5s infinite;

            pointer-events: none;
        }

        @keyframes christmasShine {

            0%, 55% {
                left: -100%;
            }

            75%, 100% {
                left: 140%;
            }

        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 35px;

            color: #68758c;

            font-size: 13px;
        }

        /* =========================
           CHRISTMAS SNOW
        ========================= */

        .christmas-snow {
            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 9990;

            overflow: hidden;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,255,255,.95) 0 2px,
                    transparent 2.5px
                ),

                radial-gradient(
                    circle,
                    rgba(255,255,255,.8) 0 1.5px,
                    transparent 2px
                ),

                radial-gradient(
                    circle,
                    rgba(255,255,255,.7) 0 1px,
                    transparent 1.5px
                );

            background-size:
                140px 140px,
                90px 90px,
                55px 55px;

            background-position:
                0 0,
                25px 35px,
                45px 15px;

            animation:
                christmasSnow 14s linear infinite;

            opacity: .7;
        }

        @keyframes christmasSnow {

            from {
                background-position:
                    0 -140px,
                    25px -90px,
                    45px -55px;
            }

            to {
                background-position:
                    80px 100vh,
                    -25px 100vh,
                    70px 100vh;
            }

        }

        /* =========================
           CHRISTMAS LIGHTS
        ========================= */

        .christmas-lights {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 32px;

            z-index: 10001;

            pointer-events: none;

            display: flex;

            justify-content: space-around;

            align-items: flex-start;

            padding: 0 8px;
        }

        .christmas-lights::before {
            content: "";

            position: absolute;

            left: 0;
            right: 0;

            top: 2px;

            height: 2px;

            background:
                rgba(255,255,255,.25);

            box-shadow:
                0 0 8px rgba(255,255,255,.15);
        }

        .christmas-lights span {
            width: 11px;
            height: 15px;

            margin-top: 4px;

            border-radius:
                50% 50% 45% 45%;

            background: #ff3b30;

            box-shadow:
                0 0 10px #ff3b30,
                0 0 20px rgba(255,59,48,.7);

            animation:
                christmasBlink 1.8s infinite alternate;
        }

        .christmas-lights span:nth-child(2n) {
            background: #42df96;

            box-shadow:
                0 0 10px #42df96,
                0 0 20px rgba(66,223,150,.7);

            animation-delay: .4s;
        }

        .christmas-lights span:nth-child(3n) {
            background: #ffd54a;

            box-shadow:
                0 0 10px #ffd54a,
                0 0 20px rgba(255,213,74,.7);

            animation-delay: .8s;
        }

        @keyframes christmasBlink {

            from {
                opacity: .45;
                transform: scale(.8);
            }

            to {
                opacity: 1;
                transform: scale(1.1);
            }

        }

        /* =========================
           CHRISTMAS TREES
        ========================= */

        .christmas-tree {
            position: fixed;

            bottom: 18px;

            z-index: 9995;

            pointer-events: none;

            font-size: 60px;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(66,223,150,.4)
                );

            animation:
                christmasTreeFloat 3s ease-in-out infinite;
        }

        .christmas-tree.left {
            left: 12px;
        }

        .christmas-tree.right {
            right: 12px;

            animation-delay: 1.2s;
        }

        @keyframes christmasTreeFloat {

            0%, 100% {
                transform:
                    translateY(0)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translateY(-7px)
                    rotate(2deg);
            }

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 40px;
            }

            .language-box {
                top: 15px;
                right: 15px;
            }

            .christmas-tree {
                font-size: 38px;
                bottom: 12px;
            }

            .christmas-tree.left {
                left: 5px;
            }

            .christmas-tree.right {
                right: 5px;
            }

            .christmas-lights {
                height: 25px;
            }

            .christmas-lights span {
                width: 7px;
                height: 10px;
            }

        }
    </style>
</head>

<body>

    <!-- CHRISTMAS SNOW -->

    <div
        class="christmas-snow"
        aria-hidden="true">
    </div>


    <!-- CHRISTMAS LIGHTS -->

    <div
        class="christmas-lights"
        aria-hidden="true">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- CHRISTMAS TREES -->

    <div
        class="christmas-tree left"
        aria-hidden="true">

        🎄

    </div>

    <div
        class="christmas-tree right"
        aria-hidden="true">

        🎄

    </div>


    <!-- LANGUAGE SELECTOR -->

    <div class="language-box">

        <button
            class="language-button"
            onclick="toggleLanguageMenu()">

            <span id="currentFlag">🇦🇿</span>

            <span id="currentLanguage">
                AZE
            </span>

            <span class="arrow">
                ▼
            </span>

        </button>


        <div
            class="language-menu"
            id="languageMenu">

            <button
                class="language-option"
                onclick="changeLanguage('az')">

                <span class="flag">
                    🇦🇿
                </span>

                <span>
                    AZE
                </span>

            </button>


            <button
                class="language-option"
                onclick="changeLanguage('en')">

                <span class="flag">
                    🇬🇧
                </span>

                <span>
                    ENG
                </span>

            </button>


            <button
                class="language-option"
                onclick="changeLanguage('ru')">

                <span class="flag">
                    🇷🇺
                </span>

                <span>
                    RUS
                </span>

            </button>

        </div>

    </div>


    <!-- MAIN -->

    <div class="container">

        <div class="logo">
            CarCash
        </div>


        <div
            class="subtitle"
            id="subtitle">

            Virtual Car Investment Platform

        </div>


        <div class="cards">


            <!-- LOGIN -->

            <div class="card">

                <div class="icon">
                    🚗
                </div>


                <h2 id="loginTitle">
                    Login
                </h2>


                <p id="loginDescription">
                    Hesabına daxil ol və maşınlarını idarə et.
                </p>


                <button
                    id="loginButton"
                    onclick="location.href='/login.html'">

                    Login

                </button>

            </div>


            <!-- REGISTER -->

            <div class="card">

                <div class="icon">
                    🏎️
                </div>


                <h2 id="registerTitle">
                    Register
                </h2>


                <p id="registerDescription">
                    Yeni hesab yarat və CarCash-a başla.
                </p>


                <button
                    id="registerButton"
                    onclick="location.href='/register.html'">

                    Register

                </button>

            </div>


        </div>


        <div class="footer">

            © 2026 CarCash

        </div>

    </div>


    <script>

        const translations = {

            az: {

                flag: "🇦🇿",
                name: "AZE",

                subtitle:
                    "Virtual Avtomobil İnvestisiya Platforması",

                loginTitle:
                    "Giriş",

                loginDescription:
                    "Hesabına daxil ol və maşınlarını idarə et.",

                loginButton:
                    "Giriş",

                registerTitle:
                    "Qeydiyyat",

                registerDescription:
                    "Yeni hesab yarat və CarCash-a başla.",

                registerButton:
                    "Qeydiyyat"

            },


            en: {

                flag: "🇬🇧",
                name: "ENG",

                subtitle:
                    "Virtual Car Investment Platform",

                loginTitle:
                    "Login",

                loginDescription:
                    "Log in to your account and manage your cars.",

                loginButton:
                    "Login",

                registerTitle:
                    "Register",

                registerDescription:
                    "Create a new account and start with CarCash.",

                registerButton:
                    "Register"

            },


            ru: {

                flag: "🇷🇺",
                name: "RUS",

                subtitle:
                    "Виртуальная платформа инвестиций в автомобили",

                loginTitle:
                    "Вход",

                loginDescription:
                    "Войдите в аккаунт и управляйте своими автомобилями.",

                loginButton:
                    "Войти",

                registerTitle:
                    "Регистрация",

                registerDescription:
                    "Создайте новый аккаунт и начните с CarCash.",

                registerButton:
                    "Регистрация"

            }

        };


        function toggleLanguageMenu() {

            const menu =
                document.getElementById(
                    "languageMenu"
                );

            menu.classList.toggle("active");

        }


        function changeLanguage(language) {

            const data =
                translations[language];

            if (!data) return;


            document.documentElement.lang =
                language;


            document.getElementById(
                "currentFlag"
            ).textContent =
                data.flag;


            document.getElementById(
                "currentLanguage"
            ).textContent =
                data.name;


            document.getElementById(
                "subtitle"
            ).textContent =
                data.subtitle;


            document.getElementById(
                "loginTitle"
            ).textContent =
                data.loginTitle;


            document.getElementById(
                "loginDescription"
            ).textContent =
                data.loginDescription;


            document.getElementById(
                "loginButton"
            ).textContent =
                data.loginButton;


            document.getElementById(
                "registerTitle"
            ).textContent =
                data.registerTitle;


            document.getElementById(
                "registerDescription"
            ).textContent =
                data.registerDescription;


            document.getElementById(
                "registerButton"
            ).textContent =
                data.registerButton;


            localStorage.setItem(
                "carcash_language",
                language
            );


            document
                .querySelectorAll(
                    ".language-option"
                )
                .forEach(option => {

                    option.classList.remove(
                        "selected"
                    );

                });


            const selected =
                document.querySelector(
                    `.language-option[onclick="changeLanguage('${language}')"]`
                );


            if (selected) {

                selected.classList.add(
                    "selected"
                );

            }


            document.getElementById(
                "languageMenu"
            ).classList.remove(
                "active"
            );

        }


        /* Close language menu */

        document.addEventListener(
            "click",
            function(event) {

                const box =
                    document.querySelector(
                        ".language-box"
                    );


                if (!box.contains(event.target)) {

                    document.getElementById(
                        "languageMenu"
                    ).classList.remove(
                        "active"
                    );

                }

            }
        );


        /* Load saved language */

        const savedLanguage =
            localStorage.getItem(
                "carcash_language"
            ) || "az";


        changeLanguage(
            savedLanguage
        );

    </script>

</body>
</html>
